# Порядок выкатки: зависимостей нет — сервис выкатывается в первой волне.
deploy:
  dependsOn: []

global:
  automated_system: qa
  functional_system: bt
  appname: api
  environment: dev

main:
  replicas: 1
  container:
    imageFunctionalSystem: at   # демо: у ФП qa/bt своих образов нет, берём образы qa/at
  components:
    - name: api
      port: 8080
      ingress: true      # http://qa-bt-api-dev
    - name: worker
      port: 8080
