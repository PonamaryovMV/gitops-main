# DAST как верификация стейджа uat: Job запускает в Jenkins джобу qa-at/DAST,
# ждёт завершения и выходит с кодом 0 (SUCCESS) или 1 — от этого Freight становится verified или нет.
# Учётка kargo и пароль — секрет jenkins-kargo (создаёт scripts/windows/up.ps1).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: dast
  namespace: qa-at
spec:
  args:
    - name: repos
    - name: environment
    - name: release
  metrics:
    - name: dast
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 1200
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: trigger-jenkins
                    image: python:3.14-slim
                    env:
                      - { name: JENKINS_URL, value: "http://jenkins.jenkins.svc.cluster.local:8080" }
                      - { name: JENKINS_JOB, value: "qa-at/job/DAST" }
                      - { name: JENKINS_USER, value: kargo }
                      - name: JENKINS_PASSWORD
                        valueFrom: { secretKeyRef: { name: jenkins-kargo, key: password } }
                      - { name: P_REPOS, value: "{{args.repos}}" }
                      - { name: P_ENV, value: "{{args.environment}}" }
                      - { name: P_RELEASE, value: "{{args.release}}" }
                    command: ["python", "-u", "-c"]
                    args:
                      - |
                        import base64, http.cookiejar, json, os, sys, time, urllib.parse, urllib.request
                        base = os.environ["JENKINS_URL"].rstrip("/")
                        auth = "Basic " + base64.b64encode(f"{os.environ['JENKINS_USER']}:{os.environ['JENKINS_PASSWORD']}".encode()).decode()
                        opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
                        def call(url, method="GET", headers=None):
                            req = urllib.request.Request(url, method=method, headers={"Authorization": auth, **(headers or {})})
                            return opener.open(req, timeout=30)
                        crumb = json.load(call(f"{base}/crumbIssuer/api/json"))
                        q = urllib.parse.urlencode({"REPOS": os.environ["P_REPOS"], "ENVIRONMENT": os.environ["P_ENV"], "RELEASE": os.environ["P_RELEASE"]})
                        r = call(f"{base}/job/{os.environ['JENKINS_JOB']}/buildWithParameters?{q}", "POST", {crumb["crumbRequestField"]: crumb["crumb"]})
                        queue = r.headers["Location"].rstrip("/")
                        print("Jenkins: DAST поставлен в очередь", queue)
                        build = None
                        while build is None:
                            time.sleep(3)
                            item = json.load(call(f"{queue}/api/json"))
                            if item.get("cancelled"):
                                sys.exit("DAST: сборка отменена в очереди")
                            build = (item.get("executable") or {}).get("url")
                        print("Jenkins: DAST запущен", build)
                        while True:
                            time.sleep(5)
                            b = json.load(call(f"{build.rstrip('/')}/api/json"))
                            if not b.get("building") and b.get("result"):
                                print("Jenkins: DAST", b["result"])
                                sys.exit(0 if b["result"] == "SUCCESS" else 1)
