# dev → test → uat → dast → prod. dev/test/uat/prod — Promote вручную, dast — автоматически после uat.
# В prod попадает только Freight, прошедший стадию dast.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: qa-at
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: qa-at }
      sources: { direct: true }
  promotionTemplate:
    spec:
      steps:
        - task: { name: promote-gitops }
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: qa-at
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: qa-at }
      sources: { stages: [dev] }
  promotionTemplate:
    spec:
      steps:
        - task: { name: promote-gitops }
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: uat
  namespace: qa-at
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: qa-at }
      sources: { stages: [test] }
  promotionTemplate:
    spec:
      steps:
        - task: { name: promote-gitops }
---
# DAST — отдельный шаг после uat. Ничего не деплоит: Freight, развёрнутый на uat,
# автоматически (ProjectConfig) попадает сюда, и Kargo запускает Jenkins qa-at/DAST и ждёт статус.
# Повтор DAST без передеплоя — кнопка Reverify на этой стадии.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dast
  namespace: qa-at
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: qa-at }
      sources: { stages: [uat] }
  promotionTemplate:
    spec:
      steps:
        - uses: compose-output
          as: dast
          config:
            freight: ${{ ctx.targetFreight.name }}
  verification:
    analysisTemplates:
      - name: dast
    args:
      - name: repos
        value: https://github.com/PonamaryovMV/qa-at-mgmt,https://github.com/PonamaryovMV/qa-at-core,https://github.com/PonamaryovMV/qa-at-api
      - name: environment
        value: uat
      - name: release
        value: ${{ commitFrom("https://github.com/PonamaryovMV/gitops-main.git").ID }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: qa-at
spec:
  requestedFreight:
    - origin: { kind: Warehouse, name: qa-at }
      sources: { stages: [dast] }
  promotionTemplate:
    spec:
      steps:
        - task: { name: promote-prod }
