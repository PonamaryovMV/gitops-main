metadata:
  name: kargo-deploy-reader
  namespace: qa-bt-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kargo-deploy-reader
subjects:
  - kind: ServiceAccount
    name: deploy-reader
    namespace: qa-bt
---
