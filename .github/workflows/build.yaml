# Сборка образа приложения в ghcr.io/ponamaryovmv/<app>:<version>.
#
# Обычный релиз — git-тег вида <app>/v<X.Y.Z>:
#   git tag hello-api/v1.1.0 && git push origin hello-api/v1.1.0
#
# Сломанная сборка (для проверки отката canary) или свой цвет — вручную:
#   Actions → build → Run workflow (app, version, broken, color)
#
# Kargo Warehouse видит новый тег в ghcr за ~30с и начинает промоушен.
name: build

on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch:
    inputs:
      app:
        description: Приложение
        type: choice
        options: [hello-api, color-web]
      version:
        description: Версия X.Y.Z
        required: true
      broken:
        description: "/health отдаёт 500 (canary должен откатиться)"
        type: boolean
        default: false
      color:
        description: Цвет (пусто — по минорной версии)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Параметры сборки
        id: meta
        env:
          IN_APP: ${{ inputs.app }}
          IN_VERSION: ${{ inputs.version }}
          IN_BROKEN: ${{ inputs.broken }}
          IN_COLOR: ${{ inputs.color }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            APP="${GITHUB_REF_NAME%%/v*}"
            VERSION="${GITHUB_REF_NAME##*/v}"
            BROKEN=false
            COLOR=""
          else
            APP="$IN_APP"; VERSION="$IN_VERSION"; BROKEN="${IN_BROKEN:-false}"; COLOR="$IN_COLOR"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Версия '$VERSION' не X.Y.Z"; exit 1; }
          if [ -z "$COLOR" ]; then
            palette=(blue green orange purple teal crimson gold)
            minor="$(echo "$VERSION" | cut -d. -f2)"
            COLOR="${palette[$((minor % 7))]}"
          fi
          {
            echo "app=$APP"
            echo "version=$VERSION"
            echo "broken=$BROKEN"
            echo "color=$COLOR"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$APP:$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - name: Проверить, что приложение существует
        run: test -f "apps/${{ steps.meta.outputs.app }}/src/Dockerfile"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ steps.meta.outputs.app }}/src
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COLOR=${{ steps.meta.outputs.color }}
            APP_BROKEN=${{ steps.meta.outputs.broken }}

      - name: Итог
        run: echo "### ${{ steps.meta.outputs.image }} (broken=${{ steps.meta.outputs.broken }}, color=${{ steps.meta.outputs.color }})" >> "$GITHUB_STEP_SUMMARY"
