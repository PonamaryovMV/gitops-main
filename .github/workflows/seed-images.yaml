# Однократная подготовка образов для стенда (сборок в релизном флоу нет — BuildRelease только фиксирует теги).
# ФП qa/at: сервисы mgmt, core, api × компоненты api, worker × теги release-1-101, release-2-102, release-3-103.
# Запуск: Actions → seed-images → Run workflow.
name: seed-images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Собрать и запушить 18 образов
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for svc in mgmt core api; do
            for comp in api worker; do
              for tag in release-1-101 release-2-102 release-3-103; do
                image="ghcr.io/${owner}/qa-at-${svc}-${comp}:${tag}"
                echo "::group::${image}"
                docker buildx build --push --provenance=false --sbom=false \
                  --build-arg APP_SERVICE="qa-at-${svc}" \
                  --build-arg APP_COMPONENT="${comp}" \
                  --build-arg APP_VERSION="${tag}" \
                  -t "${image}" demo-app
                echo "::endgroup::"
                echo "- \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
              done
            done
          done
