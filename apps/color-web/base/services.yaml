# stable — снаружи доступен через NodePort (порт задаётся в envs/<env>)
apiVersion: v1
kind: Service
metadata:
  name: color-web
  labels:
    app.kubernetes.io/name: color-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: color-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# canary — Argo Rollouts добавляет в селектор хэш canary-ReplicaSet
apiVersion: v1
kind: Service
metadata:
  name: color-web-canary
  labels:
    app.kubernetes.io/name: color-web
spec:
  selector:
    app.kubernetes.io/name: color-web
  ports:
    - name: http
      port: 80
      targetPort: http
