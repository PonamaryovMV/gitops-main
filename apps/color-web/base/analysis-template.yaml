# Шаг canary: 6 проверок /health у canary-подов раз в 5с.
# Сборка с --broken отдаёт 500 → анализ падает → Rollout откатывается на stable.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: color-web-health
spec:
  args:
    - name: service
    - name: namespace
  metrics:
    - name: health
      interval: 5s
      count: 6
      failureLimit: 1
      consecutiveErrorLimit: 2
      successCondition: result == "ok"
      provider:
        web:
          url: "http://{{args.service}}.{{args.namespace}}.svc.cluster.local/health"
          jsonPath: "{$.status}"
          timeoutSeconds: 5
