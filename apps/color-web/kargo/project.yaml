# Kargo Project создаёт неймспейс color-web; остальные ресурсы пайплайна живут в нём.
apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: color-web
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# dev и stage получают новые версии автоматически, prod — только вручную
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: color-web
  namespace: color-web
spec:
  promotionPolicies:
    - stageSelector:
        name: dev
      autoPromotionEnabled: true
    - stageSelector:
        name: stage
      autoPromotionEnabled: true
