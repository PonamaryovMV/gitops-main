# Следит за тегами образа в локальном registry.
# Новый semver-тег (scripts/build-app.sh color-web X.Y.Z) → новый Freight.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: color-web
  namespace: color-web
spec:
  interval: 30s
  subscriptions:
    - image:
        repoURL: kind-registry:5000/color-web
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
        # registry с self-signed сертификатом (см. scripts/up.sh)
        insecureSkipTLSVerify: true
