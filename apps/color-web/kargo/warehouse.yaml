# Следит за тегами образа в ghcr.io (собирает GitHub Actions, .github/workflows/build.yaml).
# Новый semver-тег → новый Freight. Пакет в ghcr должен быть публичным.
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: color-web
  namespace: color-web
spec:
  interval: 30s
  subscriptions:
    - image:
        repoURL: ghcr.io/ponamaryovmv/color-web
        imageSelectionStrategy: SemVer
        discoveryLimit: 10
