# Промоушен = коммит нового тега в apps/<app>/envs/<stage> (ветка main) + sync Argo CD.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: promote
  namespace: color-web
spec:
  vars:
    - name: app
      value: color-web
    - name: gitRepo
      value: https://github.com/PonamaryovMV/gitops-main.git
    - name: imageRepo
      value: ghcr.io/ponamaryovmv/color-web
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitRepo }}
        checkout:
          - branch: main
            path: ./repo
    - uses: kustomize-set-image
      config:
        path: ./repo/apps/${{ vars.app }}/envs/${{ ctx.stage }}
        images:
          - image: ${{ vars.imageRepo }}
            tag: ${{ imageFrom(vars.imageRepo).Tag }}
    - uses: git-commit
      config:
        path: ./repo
        message: "kargo(${{ vars.app }}): ${{ ctx.stage }} → ${{ imageFrom(vars.imageRepo).Tag }}"
    - uses: git-push
      as: push
      config:
        path: ./repo
    - uses: argocd-update
      config:
        apps:
          - name: ${{ vars.app }}-${{ ctx.stage }}
            sources:
              - repoURL: ${{ vars.gitRepo }}
                desiredRevision: ${{ task.outputs.push.commit }}
