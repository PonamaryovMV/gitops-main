apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: ghcr.io/ponamaryovmv/color-web
  newTag: 1.2.0
patches:
- target:
    kind: Service
    name: color-web
  patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30111
- target:
    kind: Rollout
    name: color-web
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
