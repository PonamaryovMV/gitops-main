# Проверка после промоушена: стейдж реально отдаёт ту версию, что пришла во Freight.
# Запускается, когда Application стал Healthy (т.е. canary в Rollout завершился).
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke
  namespace: hello-api
spec:
  args:
    - name: url
    - name: version
  metrics:
    - name: serves-promoted-version
      interval: 5s
      count: 3
      failureLimit: 1
      successCondition: result == "{{args.version}}"
      provider:
        web:
          url: "{{args.url}}/version"
          jsonPath: "{$.version}"
          timeoutSeconds: 5
