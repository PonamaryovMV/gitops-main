apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-api
  labels:
    app.kubernetes.io/name: hello-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-api
    spec:
      containers:
        - name: app
          # Тег меняет Kargo (kustomize-set-image в envs/<stage>/kustomization.yaml)
          image: ghcr.io/ponamaryovmv/hello-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
  strategy:
    canary:
      # Без traffic routing: вес задаётся числом подов, а canaryService
      # смотрит только на canary-поды — их и проверяет анализ.
      canaryService: hello-api-canary
      stableService: hello-api
      steps:
        - setWeight: 50
        - pause: { duration: 15s }
        - analysis:
            templates:
              - templateName: hello-api-health
            args:
              - name: service
                value: hello-api-canary
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
        - setWeight: 100
