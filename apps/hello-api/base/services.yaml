# stable — снаружи доступен через NodePort (порт задаётся в envs/<env>)
apiVersion: v1
kind: Service
metadata:
  name: hello-api
  labels:
    app.kubernetes.io/name: hello-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: hello-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# canary — Argo Rollouts добавляет в селектор хэш canary-ReplicaSet
apiVersion: v1
kind: Service
metadata:
  name: hello-api-canary
  labels:
    app.kubernetes.io/name: hello-api
spec:
  selector:
    app.kubernetes.io/name: hello-api
  ports:
    - name: http
      port: 80
      targetPort: http
